[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyis"
version = "1.10.7"
description = "A Python library for value validation and internet status checks"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Amirhossein Mohammadi", email = "amirhosseinmohammadi1380@yahoo.com" }
]
keywords = [
    "validation",
    "type-checking",
    "internet",
    "http",
    "utilities"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.urls]
Homepage = "https://pyis.amirhossein.info"
Repository = "https://github.com/BlackIQ/pyis"
Issues = "https://github.com/BlackIQ/pyis/issues"

[tool.setuptools.packages.find]
include = ["pyis*"]

[dependency-groups]
dev = [
    "build>=1.6.1",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "pytest>=9.2.0",
    "twine>=7.0.0",
]
